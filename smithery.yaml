# Smithery configuration for SENATRAN: Validar CNH
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_senatran_validar_cnh

name: senatran_validar_cnh-mcp
displayName: "SENATRAN: Validar CNH"
description: >
  SENATRAN: Validar CNH, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/senatran_validar_cnh-mcp
repository: https://github.com/mcp-dir/senatran_validar_cnh-mcp

tags:
  - senatran_validar_cnh
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_senatran_validar_cnh

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_senatran_validar_cnh/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
